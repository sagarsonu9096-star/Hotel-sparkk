<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel Sparkk Admin</title><style>
body{font:15px Arial,sans-serif;background:#faf6ee;color:#10162b;margin:0;padding:24px}
main{max-width:1100px;margin:auto}h1{color:#0b1630}.card{background:white;padding:18px;border-radius:10px;margin:14px 0;box-shadow:0 4px 18px #0001}
input,button{padding:11px;margin:5px;border:1px solid #ccd0d8;border-radius:6px}button{background:#0b1630;color:white;cursor:pointer}
table{width:100%;border-collapse:collapse;background:white}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.hidden{display:none}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats div{background:#f0e5ce;padding:15px;border-radius:8px;min-width:140px}
</style></head><body><main><h1>Hotel Sparkk Deluxe · Admin</h1>
<section class="card" id="login"><h2>Admin login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></section>
<section id="panel" class="hidden"><div class="card"><button onclick="loadData()">Refresh</button> <button onclick="logout()">Logout</button><div class="stats" id="stats"></div></div>
<div class="card"><h2>Bookings</h2><div style="overflow:auto"><table><thead><tr><th>Reference</th><th>Guest</th><th>Room</th><th>Dates</th><th>Amount</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="card"><h2>Add room type</h2><input id="code" placeholder="Code e.g. DELUXE"><input id="roomname" placeholder="Room name"><input id="price" type="number" placeholder="Price/night ₹"><input id="units" type="number" placeholder="Number of rooms"><button onclick="addRoom()">Add room</button></div>
<div class="card"><h2>Room types</h2><div id="rooms"></div></div></section></main>
<script>
let token=localStorage.getItem("hs_admin")||"";
async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...opts.headers}});let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function login(){try{let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.setItem("hs_admin",token);document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");loadData()}catch(e){msg.textContent=e.message}}
function logout(){localStorage.removeItem("hs_admin");location.reload()}
async function loadData(){try{let [d,b,r]=await Promise.all([api("/api/admin/dashboard"),api("/api/admin/bookings"),api("/api/rooms")]);stats.innerHTML=[["Bookings",d.totalBookings],["Confirmed",d.confirmedBookings],["Pending payment",d.pendingPayments],["Paid revenue","₹"+d.revenueRupees]].map(x=>`<div><b>${x[0]}</b><br>${x[1]}</div>`).join("");rows.innerHTML=b.bookings.map(x=>`<tr><td>${x.bookingRef}</td><td>${x.customerName}<br>${x.customerPhone}</td><td>${x.roomName}</td><td>${new Date(x.checkIn).toLocaleDateString()} – ${new Date(x.checkOut).toLocaleDateString()}</td><td>₹${(x.amountPaise/100).toFixed(2)}</td><td>${x.paymentStatus}</td><td>${x.status}</td><td><button onclick="setStatus('${x._id}','cancelled')">Cancel</button></td></tr>`).join("");rooms.innerHTML=r.rooms.map(x=>`<p><b>${x.name}</b> · ${x.code} · ₹${x.pricePerNight}/night · ${x.totalUnits} units</p>`).join("")}catch(e){alert(e.message);if(e.message.includes("token"))logout()}}
async function setStatus(id,status){await api("/api/admin/bookings/"+id+"/status",{method:"PATCH",body:JSON.stringify({status})});loadData()}
async function addRoom(){try{await api("/api/admin/rooms",{method:"POST",body:JSON.stringify({code:code.value,name:roomname.value,pricePerNight:Number(price.value),totalUnits:Number(units.value)})});loadData();alert("Room type added")}catch(e){alert(e.message)}}
if(token){document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");loadData()}
</script></body></html>
